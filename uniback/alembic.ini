# Alembic configuration for Uniback

[alembic]
# Path to migration scripts
script_location = src/uniback/persistence/migrations

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# Defaults to the current working directory.
prepend_sys_path = ./src

# Version path separator; defaults to os.pathsep
version_path_separator = os

# Default database URL (can be overridden with UNIBACK_DB_URL env variable)
sqlalchemy.url=postgresql://postgres:pg_passwd@localhost:5433/ub_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S