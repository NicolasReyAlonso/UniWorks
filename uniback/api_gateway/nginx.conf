events {
    worker_connections 1024;
}

http {
    # Evitar problemas con CORS enviando todo a través del proxy
    server {
        listen 8000; # El gateway escuchará en el puerto 8000 para que el frontend no note diferencia

        # Las cabeceras CORS las maneja el backend (FastAPI CORSMiddleware)
        # por lo que no las inyectamos aquí para evitar duplicidades o conflictos con credentials=True.

        # Redirigir llamadas al nodo Auth /api/auth/* y relacionados con usuarios/auth
        location ~ ^/api/(authn|user_roles|token_verification|api_keys|authr_explain|authr_ref_entities|functions|identities|identities_authenticators|roles|identities_roles|organizations|groups|identity_store|acl|acl_expressions) {
            proxy_pass http://auth_node:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirigir llamadas de Especies (Darwin Core)
        location ~ ^/api/species {
            proxy_pass http://species_node:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirigir llamadas de Ficheros
        location ~ ^/api/(files|file_stores) {
            proxy_pass http://files_node:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirigir llamadas de Anotaciones
        location ~ ^/api/(annotation_form_templates|annotation_form_fields|annotation_form_relationships|annotations|relationships) {
            proxy_pass http://annotations_node:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirigir llamadas de Socket.IO
        location /socket.io/ {
            proxy_pass http://web:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Redirigir todas las demás llamadas /api/* al nodo del monolito (Core)
        location /api/ {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Endpoint raíz
        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
        }
    }
}

