<nz-modal [(nzVisible)]="isVisible" nzCentered [nzClosable]="false">
  <ng-container *nzModalTitle>
    {{ 'GEO_VIEWER.TABS.MAP.MODAL_SETTNGS.TITLE' | translate }}
  </ng-container>
  <ng-container *nzModalContent>
    <div>
      <nz-spin [nzSpinning]="loading">
        <form nz-form [formGroup]="formGroup" nzLayout="vertical">
          <nz-form-item>
            <nz-form-label nzFor="baseLayer">
              {{ 'GEO_VIEWER.TABS.MAP.MODAL_SETTNGS.CONTENT.BASE_LAYER_INPUT.LABEL' | translate }}
            </nz-form-label>
            <nz-form-control>
              <nz-select formControlName="baseLayer" *ngIf="formGroup.get('baseLayerType').value === 'default'"
                         [nzPlaceHolder]="'GEO_VIEWER.TABS.MAP.MODAL_SETTNGS.CONTENT.BASE_LAYER_INPUT.PLACEHOLDER' | translate">
                <nz-option *ngFor="let option of baseLayerDefaultOptions" [nzValue]="option.value"
                           [nzLabel]="option.label"></nz-option>
              </nz-select>
              <input nz-input formControlName="baseLayer" *ngIf="formGroup.get('baseLayerType').value === 'custom'"
                     [placeholder]="'GEO_VIEWER.TABS.MAP.MODAL_SETTNGS.CONTENT.BASE_LAYER_INPUT.PLACEHOLDER' | translate">
              <nz-radio-group formControlName="baseLayerType" style="margin-top: 5px;"
                              (ngModelChange)="changebaseLayerTypeEvent($event)">
                <label nz-radio nzValue="default">
                  {{'GEO_VIEWER.TABS.MAP.MODAL_SETTNGS.CONTENT.BASE_LAYER_INPUT.TYPE.DEFAULT' |
                  translate}}
                </label>
                <label nz-radio nzValue="custom">
                  {{'GEO_VIEWER.TABS.MAP.MODAL_SETTNGS.CONTENT.BASE_LAYER_INPUT.TYPE.CUSTOM' | translate}}
                </label>
              </nz-radio-group>
            </nz-form-control>
          </nz-form-item>
          <nz-form-item>
            <nz-form-label nzFor="baseLayer">
              {{ 'GEO_VIEWER.TABS.MAP.MODAL_SETTNGS.CONTENT.PROJECTION_INPUT.LABEL' | translate }}
            </nz-form-label>
            <nz-select formControlName="projection" [nzPlaceHolder]="'GEO_VIEWER.TABS.MAP.MODAL_SETTNGS.CONTENT.PROJECTION_INPUT.PLACEHOLDER' | translate ">
              <nz-option nzValue="EPSG:3857" nzLabel="EPSG:3857 - WGS 84 / Pseudo-Mercator"></nz-option>
              <nz-option [nzValue]="item.attributes.code" [nzLabel]="item.attributes.code + ' - ' + item.name" *ngFor="let item of projectionsMap"></nz-option>
            </nz-select>
          </nz-form-item>
        </form>
      </nz-spin>
    </div>
  </ng-container>
  <ng-container *nzModalFooter>
    <button nz-button nzType="primary" nzDanger [disabled]="loading" (click)="onCancelClick()">
      {{ 'GEO_VIEWER.TABS.MAP.MODAL_SETTNGS.FOOTER.CANCEL_BUTTON' | translate }}
    </button>
    <button nz-button nzType="primary" [disabled]="loading" (click)="onAcceptClick()">
      {{ 'GEO_VIEWER.TABS.MAP.MODAL_SETTNGS.FOOTER.ACCEPT_BUTTON' | translate }}
    </button>
  </ng-container>
</nz-modal>
