<div class="nextgendem-geolayer-container">
  <nz-spin [nzSpinning]="geolayerLoading || externalLoading">
    <app-nextgendem-geolayer-top-area></app-nextgendem-geolayer-top-area>

    <div style="display: flex; flex: 1 1 auto; min-height: 0">

      <div style="position: relative; flex: 1 1 auto; min-width: 0">

        <app-nextgendem-geolayer-map (afterViewInitStart)="afterViewInitStartMap()"
                                     [(whereClickMapInfo)]="whereClickMapInfo"
                                     (whereClickMapInfoChange)="whereClickMapInfoChange($event)"
                                     (geolayerLoadingChange)="geolayerLoading = $event"
                                     (clickMapEvent)="clickMapEvent($event)"
                                     (changeWhereClickMapInfo)="whereClickMapInfoChange($event)"></app-nextgendem-geolayer-map>

        <!-- Resizable -->
        <div style="height: 100%; width: 10px; right: -5px; top: 0; position: absolute; z-index: 999;">
          <div style="height: 100%; align-items: center; justify-content: center; display: flex;">
            <i nz-icon nzType="more" nzTheme="outline" class="nextgendem-geolayer-resize-icon"
               (mousedown)="mouseDownResize($event)"></i>
          </div>
        </div>

      </div>

      <div style="height: 100%;" [ngStyle]="{'width': getFlexGrid()}">

        <app-nextgendem-geolayer-configuration-panel (openModalMapSettings)="openModalMapSettings()"
                                                     (openModalAddProperty)="openModalAddProperty()"
                                                     (checkProperty)="checkProperty($event)"
                                                     (attributesZIndexChange)="attributesZIndexChange($event)"
                                                     (changeOpacityProperty)="changeOpacityProperty($event)"
                                                     (removeAttribute)="removeAttribute($event)"
                                                     (showLegendProperty)="showLegendProperty($event)"
                                                     (changeFilterSelectedProperty)="changeFilterSelectedProperty($event)"
                                                     (changeFilterCQLayer)="changeFilterCQLayer($event)"
                                                     (removeFilterLayer)="removeFilterLayer($event)"
                                                     (editStyleProperty)="editStyleProperty($event)"
                                                     (geolayerLoading)="geolayerLoading = $event"
                                                     (createMap)="createMap($event)"
                                                     (overwriteMap)="overwriteMap($event)"
                                                     (changeWhereClickMapInfo)="whereClickMapInfoChange($event)"
        />

      </div>


    </div>
  </nz-spin>
</div>

<app-nextgendem-geolayer-map-settings [(isVisible)]="isVisibleMapSettings"
                                      (acceptEmmiter)="onAcceptMapSettings($event)"></app-nextgendem-geolayer-map-settings>

<app-nextgendem-geolayer-add-attribute-modal
  (accept)="onAcceptAddAttributeModal($event)"></app-nextgendem-geolayer-add-attribute-modal>
