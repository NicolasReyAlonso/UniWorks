<nz-modal [(nzVisible)]="isVisible" nzCentered (nzOnCancel)="closeModal()"
    [nzTitle]="'METADATA.CRS.CREATE_MODAL.TITLE' | translate" [nzMaskClosable]="false" [nzClosable]="false">
    <ng-container *nzModalContent>
        <div>
            <nz-spin [nzSpinning]="loading">
                <form [formGroup]="formGroup">
                    <div>
                        <nz-form-label nzFor="name">
                            {{ 'METADATA.CRS.CREATE_MODAL.NAME_INPUT.LABEL' | translate }}
                        </nz-form-label>
                        <input nz-input
                            [placeholder]="'METADATA.CRS.CREATE_MODAL.NAME_INPUT.PLACEHOLDER' | translate"
                            formControlName="name" [ngClass]="{'input-error': getMessageNameError()}" />
                        <div *ngFor="let item of getMessageNameError()" class="message-error">
                            {{item | translate}}
                        </div>
                    </div>
                    <div>
                      <nz-form-label nzFor="code">
                          {{ 'METADATA.CRS.CREATE_MODAL.CODE_INPUT.LABEL' | translate }}
                      </nz-form-label>
                      <input nz-input
                          [placeholder]="'METADATA.CRS.CREATE_MODAL.CODE_INPUT.PLACEHOLDER' | translate"
                          formControlName="code" [ngClass]="{'input-error': getMessageCodeError()}" />
                      <div *ngFor="let item of getMessageCodeError()" class="message-error">
                          {{item | translate}}
                      </div>
                  </div>
                  <div>
                    <nz-form-label nzFor="proj4">
                        {{ 'METADATA.CRS.CREATE_MODAL.PROJ4_INPUT.LABEL' | translate }}
                    </nz-form-label>
                    <input nz-input
                        [placeholder]="'METADATA.CRS.CREATE_MODAL.PROJ4_INPUT.PLACEHOLDER' | translate"
                        formControlName="proj4" [ngClass]="{'input-error': getMessageProj4Error()}" />
                    <div *ngFor="let item of getMessageProj4Error()" class="message-error">
                        {{item | translate}}
                    </div>
                </div>
                </form>
            </nz-spin>
        </div>
    </ng-container>
    <ng-container *nzModalFooter>
        <button nz-button nzType="primary" nzDanger (click)="closeModal()" [disabled]="loading">
            {{ 'METADATA.CRS.CREATE_MODAL.CANCEL_BUTTON' | translate }}
        </button>
        <button nz-button nzType="primary" (click)="onCreateCrs()" [disabled]="!formGroup.valid || loading">
            {{ 'METADATA.CRS.CREATE_MODAL.ACCEPT_BUTTON' | translate }}
        </button>
    </ng-container>
</nz-modal>

<app-info-modal [(isVisible)]="isVisibleInfoModal" typeIcon="close-circle" themeIcon="twotone"
    twotoneColorIcon="#ff0000" title="METADATA.CRS.CREATE_MODAL.ERROR_CREATE_THEME.TITLE"
    content="METADATA.CRS.CREATE_MODAL.ERROR_CREATE_THEME.CONTENT" [buttons]="buttonsInfoModal"></app-info-modal>
