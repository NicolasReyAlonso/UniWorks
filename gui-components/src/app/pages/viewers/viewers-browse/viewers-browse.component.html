<app-dynamic-browse [Loading]="loading" [BrowserTitle]="'DISPLAY.VIEWERS.BROWSE.TITLE'" [BrowserType]="'viewer'" [CustomButtonsBrowser]="buttons"
                    [Checkable]="true" (OpenItemEvent)="onOpenViewItem($event)" (DeleteSelectedEvent)="deleteSelected($event)" [DefaultShowFields]="['name', 'type']"
                    (DeleteItemEvent)="onDeleteViewItem($event)" [HiddenDelete]="!this.authService.havePermission('gui-viewer-delete')"
                    (PermissionItemEvent)="permissionItem($event)" [HiddenPermissions]="!authService.havePermission('gui-viewer-acl')"
>
</app-dynamic-browse>

<nz-modal [(nzVisible)]="isVisibleDeleteItemModal" (nzOnCancel)="isVisibleDeleteItemModal = false"
          [nzMaskClosable]="false" nzCentered [nzWidth]="480" [nzFooter]="null">
  <ng-container *nzModalContent>
    <div>
      <div style="display: flex; column-gap: 20px; padding: 32px; width: 100%">
        <div style="flex: 0 1 auto">
          <i nz-icon nzType="exclamation-circle" [nzTheme]="'twotone'" [nzTwotoneColor]="'#e30808'"
             style="font-size: 28px;"></i>
        </div>
        <div style="flex: 1 1 auto; min-width: 0; min-height: 0; row-gap: 9px; display: flex; flex-direction: column">
          <div style="font-weight: 360; font-size: 21px; line-height: 1.4">
            <i>
              {{'DISPLAY.VIEWERS.BROWSE.DELETE_ITEM_MODAL.TITLE' | translate}}
            </i>
          </div>
          <div style="font-weight: 600; width: 100%">
            {{'DISPLAY.VIEWERS.BROWSE.DELETE_ITEM_MODAL.CONTENT' | translate:{name: this.deleteItemInstance.name} }}
          </div>
        </div>
      </div>
      <div style="display: flex; flex-direction: row-reverse; column-gap: 5px; margin-top: 22px">
        <button nz-button nzType="primary" (click)="deleteItem(this.deleteItemInstance.id)">{{'DISPLAY.VIEWERS.BROWSE.DELETE_ITEM_MODAL.ACCEPT_BUTTON' | translate}}</button>
        <button nz-button nzType="primary" nzDanger (click)="isVisibleDeleteItemModal = false">{{'DISPLAY.VIEWERS.BROWSE.DELETE_ITEM_MODAL.CANCEL_BUTTON' | translate}}</button>
      </div>
    </div>
  </ng-container>
</nz-modal>

<app-acl-modal  #modalAclRef [(isVisible)]="isVisibleAclModal"></app-acl-modal>
